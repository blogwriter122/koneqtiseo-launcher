name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.3)'
        required: true
        default: '1.0.3'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build-win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build-mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
      - uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: dist/*.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build-linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
      - uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: dist/*.AppImage

  create-release:
    needs: [build-windows, build-mac, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: KoneqtiSEO Launcher v${{ github.event.inputs.version }}
          generate_release_notes: false
          files: |
            artifacts/windows-installer/*.exe
            artifacts/mac-installer/*.dmg
            artifacts/linux-installer/*.AppImage
          body: |
            ## KoneqtiSEO Launcher v${{ github.event.inputs.version }}

            ### Download for your OS:
            - **Windows**: `KoneqtiSEO-Launcher-Setup.exe`
            - **macOS**: `KoneqtiSEO-Launcher.dmg`
            - **Linux**: `KoneqtiSEO-Launcher.AppImage`

            ### Setup (2 minutes):
            1. Download and install
            2. Open the launcher
            3. Go to **koneqtiseo.com/settings** → copy your API key
            4. Paste key → click **Connect** → green dot ✅
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
